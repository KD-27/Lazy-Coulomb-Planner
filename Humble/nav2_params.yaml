# ============================================================================
#  Nav2 Parameters — Lazy Coulomb Planner
#  Drop this file into your robot's config directory and point your
#  nav2_bringup launch file at it via the params_file argument.
# ============================================================================

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0

    # ── Active plugins ─────────────────────────────────────────────────────
    # You can keep NavFn/Smac as fallback by listing both:
    #   planner_plugins: ["LCP", "GridBased"]
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"

      # ── Iteration budget ──────────────────────────────────────────────────
      # Total steps the algorithm may take before giving up.
      # Increase for very cluttered environments.
      max_iterations: 1000

      # Maximum steps to push a single waypoint clear of an obstacle.
      max_push_iterations: 300

      # ── Physics parameters ────────────────────────────────────────────────
      # Integration step size when moving a waypoint (meters).
      # Smaller = more precise but slower; larger = faster but may overshoot.
      step_size: 0.05

      # Base magnitude of the repulsion force (meters per step).
      repulsion_strength: 0.15

      # If the computed force magnitude falls below this value the planner
      # uses the deterministic perpendicular-left fallback instead.
      force_balance_threshold: 0.01

      # Magnitude of the deterministic fallback nudge (meters).
      perturbation_strength: 0.08

      # ── Initial path ──────────────────────────────────────────────────────
      # Number of evenly-spaced waypoints in the initial straight line.
      # More points = finer initial sampling but more work per iteration.
      initial_path_points: 20

      # ── Costmap thresholds ────────────────────────────────────────────────
      # Costmap cells with cost >= this value are treated as obstacles.
      # 253 = INSCRIBED_INFLATED_OBSTACLE (includes inflation layer)
      # 254 = LETHAL_OBSTACLE only
      lethal_cost_threshold: 253.0

      # Samples taken per unit length when checking segment intersections.
      # Higher = more accurate but slower for long segments.
      segment_check_steps: 20

      # ── Path smoothing ────────────────────────────────────────────────────
      # Apply Chaikin corner-cutting to the final waypoint list.
      enable_smoothing: true

      # Number of Chaikin passes. 1–3 is usually sufficient.
      # More passes = smoother curve but may cut corners closer to obstacles.
      smoothing_iterations: 3

# ── Costmap configuration (global) ─────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      robot_radius: 0.22          # Set to your robot's circumscribed radius
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55    # Should be >= robot_radius + safety margin
