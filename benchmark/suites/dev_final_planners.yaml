# Development: final choice of attempt budget and fallback weight (Release build).
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["Navfn", "b50w2", "b50w3", "b50w4", "b75w3", "b35w3", "b50w3_lazy"]
    Navfn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
    b50w2:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 50
      reachability_check_after: 25
    b50w3:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 50
      reachability_check_after: 25
      grid_search_weight: 3.0
    b50w4:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 50
      reachability_check_after: 25
      grid_search_weight: 4.0
    b75w3:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 75
      reachability_check_after: 25
      grid_search_weight: 3.0
    b35w3:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 35
      reachability_check_after: 20
      grid_search_weight: 3.0
    b50w3_lazy:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 50
      reachability_check_after: 25
      grid_fallback: false
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
