# Tuned grid baselines (reviewer request): do the grid planners lose only because they
# optimise a cost-weighted objective? Each is run at its Nav2 default and with the
# cost term switched off, so it searches for a short path on the free cells only.
#   Navfn_astar:      use_astar true (NavFn has no cost weight; A* is its only search option)
#   Smac2d_nocost:    cost_travel_multiplier 0 (default 2)
#   ThetaStar_nocost: w_traversal_cost 0 (default 2)
# line_astar_w3: LCP with max_iterations 0 (check the line, else LCP's weighted A*).
# path_reuse_distance 0 for every LCP variant: the benchmark measures planning from scratch.
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["Navfn", "Navfn_astar", "Smac2d", "Smac2d_nocost", "ThetaStar", "ThetaStar_nocost", "LCP", "line_astar_w3"]
    Navfn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
    Navfn_astar:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: true
    Smac2d:
      plugin: "nav2_smac_planner::SmacPlanner2D"
    Smac2d_nocost:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      cost_travel_multiplier: 0.0
    ThetaStar:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
    ThetaStar_nocost:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      w_traversal_cost: 0.0
    LCP:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
    line_astar_w3:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 0
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
