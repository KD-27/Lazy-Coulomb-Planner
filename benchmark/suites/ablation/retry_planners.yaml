# Ablation: Other-side retry: off, most recent first, or shortest partial path first, and the attempt budget. Grid fallback off so the lazy search is measured alone.
# Every variant is the default LCP with only the listed parameters changed.
# path_reuse_distance 0 everywhere: the benchmark measures planning from scratch.
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["Navfn", "noretry", "recent50", "shortest25", "shortest50", "shortest100", "shortest300"]
    Navfn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
    noretry:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
      retry_other_side: false
    recent50:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
      retry_order: "recent"
    shortest25:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
      max_iterations: 25
    shortest50:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
    shortest100:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
      max_iterations: 100
    shortest300:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
      max_iterations: 300
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
