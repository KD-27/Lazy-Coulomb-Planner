# ============================================================================
#  Nav2 Parameters — Lazy Coulomb Planner
# ============================================================================

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0

    # ── Active plugins ─────────────────────────────────────────────────────
    # You can keep NavFn/Smac as fallback by listing both:
    #   planner_plugins: ["LCP", "GridBased"]
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"

      # ── Coulomb push ──────────────────────────────────────────────────────
      # "coulomb" sums a 1/r^n repulsion over nearby obstacle cells.
      # "probe" is the legacy rule: push toward the nearer clear side.
      force_model: "coulomb"
      force_exponent: 2.0        # n in 1/r^n (1.0 or 2.0)
      charge_radius: 1.0         # obstacle cells within this range repel (m)
      commit_direction: true     # keep the side chosen on the first push step
      repulsion_strength: 1.0    # cells moved per unit of normalised force
      max_push_step: 0.0         # cap on one push step (m); 0 = one costmap cell
      force_balance_threshold: 0.05

      # ── When the lazy search struggles ────────────────────────────────────
      max_iterations: 300        # waypoint placement attempts, retries included
      max_push_iterations: 400   # steps to push a single waypoint clear
      reachability_check_after: 50  # attempts before checking start/goal are not sealed in
      grid_fallback: true        # lazy search gave up: use the grid search's route

      # ── Keeping distance (needs an inflation layer in the global costmap) ─
      comfort_cost: 30.0         # avoid costs above this where possible; 253 = off
      max_clearance_push: 1.0    # furthest a waypoint moves to gain clearance (m)
      smoothing_cost_slack: 40.0 # cost a smoothing cut may add above comfort_cost

      # A goal on an occupied cell is replaced by the nearest free cell within
      # this range (m), as NavFn's tolerance does. 0 = reject such goals.
      goal_tolerance: 0.5

      # A robot stopped slightly inside the inflated zone plans from the nearest
      # free cell within this range (m). 0 = refuse to plan from an occupied cell.
      start_escape_radius: 0.5

      # Extra push past the obstacle edge when the way is free (m). Gives the
      # smoother room to round the corner and reduces repeat corrections.
      waypoint_margin: 0.3

      # ── Consistency between replans while driving ────────────────────────
      path_reuse_distance: 0.5   # keep the previous path while the robot is this near it (m)
      path_reuse_min_saving: 0.15  # ... unless a fresh plan is shorter by this fraction

      # ── Retry: on a dead end, back up and try the other side ──────────────
      retry_other_side: true
      retry_order: "shortest"    # resume from the shortest partial path ("recent" = latest)
      max_path_stretch: 5.0      # abandon detours longer than this x straight line

      # ── Costmap threshold ─────────────────────────────────────────────────
      # 253 = INSCRIBED_INFLATED_OBSTACLE (includes inflation), 254 = LETHAL only
      lethal_cost_threshold: 253.0

      # ── Post-processing ───────────────────────────────────────────────────
      simplify_path: true        # drop waypoints whose neighbours join directly
      enable_smoothing: true     # Chaikin; a corner is cut only as far as it stays clear
      smoothing_iterations: 5
      output_spacing: 0.1        # max distance between output poses (m)

# ── Costmap configuration (global) ─────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      robot_radius: 0.22          # Set to your robot's circumscribed radius
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7    # well beyond robot_radius, so the planner can keep its distance

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["map_server", "amcl"]
