# Sweep: force exponent x charge radius, direction committed.
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["Navfn", "r1_R0p5", "r1_R1p0", "r1_R2p0", "r1_R4p0", "r2_R0p5", "r2_R1p0", "r2_R2p0", "r2_R4p0"]
    Navfn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
    r1_R0p5:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      force_model: "coulomb"
      force_exponent: 1.0
      charge_radius: 0.5
      commit_direction: true
    r1_R1p0:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      force_model: "coulomb"
      force_exponent: 1.0
      charge_radius: 1.0
      commit_direction: true
    r1_R2p0:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      force_model: "coulomb"
      force_exponent: 1.0
      charge_radius: 2.0
      commit_direction: true
    r1_R4p0:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      force_model: "coulomb"
      force_exponent: 1.0
      charge_radius: 4.0
      commit_direction: true
    r2_R0p5:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      force_model: "coulomb"
      force_exponent: 2.0
      charge_radius: 0.5
      commit_direction: true
    r2_R1p0:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      force_model: "coulomb"
      force_exponent: 2.0
      charge_radius: 1.0
      commit_direction: true
    r2_R2p0:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      force_model: "coulomb"
      force_exponent: 2.0
      charge_radius: 2.0
      commit_direction: true
    r2_R4p0:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      force_model: "coulomb"
      force_exponent: 2.0
      charge_radius: 4.0
      commit_direction: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
