planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["Navfn", "off", "s0", "s20", "s40", "s80", "s150"]
    Navfn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
    off:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      comfort_cost: 253.0
    s0:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      smoothing_cost_slack: 0.0
    s20:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      smoothing_cost_slack: 20.0
    s40:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      smoothing_cost_slack: 40.0
    s80:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      smoothing_cost_slack: 80.0
    s150:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      smoothing_cost_slack: 150.0
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
