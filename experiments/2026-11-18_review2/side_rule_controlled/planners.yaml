# Side rule on the 21 controlled maps (second review, 18 Nov 2026): Coulomb and probe,
# each with the grid fallback on (time) and off (*_lazy: what the lazy search solves alone).
# path_reuse_distance 0 everywhere: the benchmark measures planning from scratch.
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["Navfn", "coulomb", "probe", "coulomb_lazy", "probe_lazy"]
    Navfn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
    coulomb:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
    probe:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      force_model: "probe"
    coulomb_lazy:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
    probe_lazy:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      force_model: "probe"
      grid_fallback: false
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
