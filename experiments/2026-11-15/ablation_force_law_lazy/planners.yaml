# Ablation: How a waypoint is pushed: the legacy probe, or a Coulomb sum with 1/r or 1/r^2, each with and without keeping the first side.
# Grid fallback off in every variant: this measures what the lazy search solves on its own.
# Every variant is the default LCP with only the listed parameters changed.
# path_reuse_distance 0 everywhere: the benchmark measures planning from scratch.
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["Navfn", "probe", "r1", "r2", "r1_free", "r2_free"]
    Navfn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
    probe:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
      force_model: "probe"
    r1:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
      force_exponent: 1.0
    r2:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
    r1_free:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
      force_exponent: 1.0
      commit_direction: false
    r2_free:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      grid_fallback: false
      commit_direction: false
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
