# Development: attempt budget of the lazy search with the A* fallback.
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["Navfn", "b300", "b150", "b100", "b50", "b100w4", "b25"]
    Navfn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
    b300:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
    b150:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 150
    b100:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 100
    b50:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 50
      reachability_check_after: 25
    b100w4:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 100
      grid_search_weight: 4.0
    b25:
      plugin: "lazy_coulomb_planner::LazyCoulombPlanner"
      path_reuse_distance: 0.0
      max_iterations: 25
      reachability_check_after: 12
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
